    request_title: "预约咨询"
    request_url: "/about/contact"
    brand_logos_on: false
    cta_title: |
      <h2>和顾问聊聊你的问题</h2>
      <p>首次咨询免费，我们会给出初步判断与建议。</p>
    company_info: "我们为企业和个人客户提供专业咨询服务，以严谨、务实的方式解决复杂问题。"
    copyright_info: "© 版权所有"
pages:
  name: "首页"
  slug: "index"
  template_name: "index"
  template_style: "sections"
  settings:
    hero_title: "专业判断，帮你做出更好的决定"
    hero_description: "资深顾问团队，覆盖多个专业领域，为客户提供从诊断到落地的完整服务。"
    hero_primary_label: "预约咨询"
    hero_primary_url: "/about/contact"
    hero_secondary_label: "服务领域"
    hero_secondary_url: "/services"
    hero_image_url: "images/demo/bg-planet.jpg"
    section_1_type: "cards"
    section_1_title: "服务领域"
    section_1_channel: "/services"
    section_1_limit: 3
    section_2_type: "html"
    section_2_title: "合作方式"
    section_2_html: |
      <ol class="wx-steps">
        <li class="wx-step"><span class="wx-step-number">1</span><h3>初步沟通</h3><p>了解背景与目标，判断是否适合合作。</p></li>
        <li class="wx-step"><span class="wx-step-number">2</span><h3>方案与报价</h3><p>明确范围、周期、交付物与费用。</p></li>
        <li class="wx-step"><span class="wx-step-number">3</span><h3>项目执行</h3><p>顾问团队按计划推进并定期汇报。</p></li>
        <li class="wx-step"><span class="wx-step-number">4</span><h3>成果交付</h3><p>交付报告与建议，并提供后续支持。</p></li>
      </ol>
    section_3_type: "cards"
    section_3_title: "成功案例"
    section_3_channel: "/cases"
    section_3_limit: 3
    section_4_type: "html"
    section_4_title: "我们的服务原则"
    section_4_html: |
      <ul class="wx-list">
        <li>独立客观：只给出符合客户利益的专业判断。</li>
        <li>严格保密：合作前签署保密协议，资料专人管理。</li>
        <li>结果导向：每个项目都有明确的交付物与验收标准。</li>
      </ul>
    section_5_type: "latest"
    section_5_title: "专业洞察"
    section_5_channel: "/insights"
    section_5_limit: 4
    section_6_type: "html"
    section_6_title: "常见问题"
    section_6_html: |
      <div class="wx-faq">
        <details><summary>咨询如何收费？</summary><p>按项目范围或顾问工时计费，方案阶段会给出明确报价。</p></details>
        <details><summary>信息会保密吗？</summary><p>合作前签署保密协议，所有资料严格保密。</p></details>
        <details><summary>可以远程合作吗？</summary><p>可以，支持线上会议与远程协作，必要时安排现场工作。</p></details>
      </div>
