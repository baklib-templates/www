apply: site_pages
page_template: page
ask_path: -/search
arrangements:
  - key: original
    title: 按来源路径
    description: 按网址路径或文件夹保留原来的层级。
    rule: original
  - key: channels
    title: 按来源分成频道
    description: 每个顶层目录成为一个频道。
    rule: top_folder
  - key: flat
    title: 集中放在导入资料栏目
    description: 所有正文平铺在首页下的专属「导入资料」栏目中。
    rule: flat
